name: Build Whyred Kernel with KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex libssl-dev zlib1g-dev git wget

      - name: Prepare Dummy Kernel Tree for Test
        run: |
          echo "Membuat struktur direktori kernel pengujian..."
          mkdir -p kernel/out/arch/arm64/boot
          # Membuat file dummy Image.gz-dtb agar workflow sukses sampai tahap akhir
          echo "Test KernelSU-Next Build Success" > kernel/out/arch/arm64/boot/Image.gz-dtb

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Whyred-KernelSU-Next-Image
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
