name: Build Whyred Kernel with KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex libssl-dev zlib1g-dev git wget unzip

      - name: Download Toolchain Clang Stable
        run: |
          mkdir -p clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/androidx-main/clang-r416183b.tar.gz -O clang.tar.gz || wget https://github.com/kdrag0n/proton-clang/archive/refs/heads/master.zip -O clang.zip
          if [ -f clang.tar.gz ]; then tar -C clang -xzf clang.tar.gz; fi
          if [ -f clang.zip ]; then unzip clang.zip && mv proton-clang-*/* clang/; fi

      - name: Download Kernel Source Whyred via Zip
        run: |
          wget https://github.com/whyred-defian/kernel_xiaomi_whyred/archive/refs/heads/lineage-20.zip -O kernel.zip || wget https://github.com/stormbreaker-project/kernel_xiaomi_whyred/archive/refs/heads/master.zip -O kernel.zip
          unzip kernel.zip
          mv kernel_xiaomi_whyred-* kernel || mv kernel_-* kernel

      - name: Setup KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.0.0

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out whyred_defconfig
          make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Whyred-KernelSU-Next-Image
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
