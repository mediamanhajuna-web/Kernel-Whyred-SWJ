name: Build Whyred Kernel with KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex libssl-dev zlib1g-dev git wget unzip

      - name: Download Toolchain Clang Universal
        run: |
          mkdir -p clang
          wget https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/master/clang-r416183b.tar.gz -O clang.tar.gz || wget https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b/archive/refs/tags/android-12.0.0_r1.zip -O clang.zip
          if [ -f clang.tar.gz ]; then tar -C clang -xzf clang.tar.gz; fi
          if [ -f clang.zip ]; then unzip clang.zip && mv android_prebuilts_clang_host_linux-x86_clang-*/* clang/; fi

      - name: Download Kernel Source Whyred via Zip
        run: |
          wget https://github.com/whyred-defian/kernel_xiaomi_whyred/archive/refs/heads/lineage-20.zip -O kernel.zip || wget https://github.com/stormbreaker-project/kernel_xiaomi_whyred/archive/refs/heads/master.zip -O kernel.zip
          unzip kernel.zip
          mv kernel_xiaomi_whyred-* kernel || mv kernel_-* kernel

      - name: Setup KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.0.0

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out why
