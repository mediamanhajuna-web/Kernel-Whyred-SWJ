      - name: Compile Kernel
        run: |
          cd kernel_src
          export PATH="${GITHUB_WORKSPACE}/clang/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export KBUILD_BUILD_USER="Antigravity"
          export KBUILD_BUILD_HOST="GitHub-Actions"

          # 1. Cek & Auto-detect file defconfig yang benar
          INPUT_DEF="${{ github.event.inputs.kernel_defconfig }}"
          if [ -f "arch/arm64/configs/${INPUT_DEF}" ]; then
            TARGET_DEF="${INPUT_DEF}"
          elif [ -f "arch/arm64/configs/vendor/${INPUT_DEF}" ]; then
            TARGET_DEF="vendor/${INPUT_DEF}"
          elif [ -f "arch/arm64/configs/whyred_defconfig" ]; then
            TARGET_DEF="whyred_defconfig"
          elif [ -f "arch/arm64/configs/vendor/whyred_defconfig" ]; then
            TARGET_DEF="vendor/whyred_defconfig"
          else
            # Cari file defconfig apapun yang ada kata 'whyred'
            FOUND=$(find arch/arm64/configs -type f -name "*whyred*defconfig" | head -n 1)
            if [ -n "$FOUND" ]; then
              TARGET_DEF="${FOUND#arch/arm64/configs/}"
            else
              echo "Defconfig tidak ditemukan di arch/arm64/configs/!"
              ls -la arch/arm64/configs/
              exit 1
            fi
          fi

          echo "Menggunakan defconfig: ${TARGET_DEF}"

          # 2. Setup defconfig
          make O=out ARCH=arm64 ${TARGET_DEF}

          # 3. Start compile dengan Clang
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
