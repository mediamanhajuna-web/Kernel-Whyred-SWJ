name: Build Whyred Kernel with KernelSU-Next

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache flex libssl-dev zlib1g-dev git wget

      - name: Clone Toolchain Clang
        run: |
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86_clang-r416183b.git clang

      - name: Clone Kernel Source Whyred Direct
        run: |
          git config --global advice.detachedHead false
          git clone --depth=1 -b twelve https://github.com/stormbreaker-project/kernel_xiaomi_whyred.git kernel || git clone --depth=1 https://github.com/whyred-defian/kernel_xiaomi_whyred.git kernel

      - name: Setup KernelSU-Next
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/rifsxd/KernelSU-Next/next/kernel/setup.sh" | bash -s v1.0.0

      - name: Compile Kernel
        run: |
          cd kernel
          export PATH="$(pwd)/../clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          make O=out whyred_defconfig
          make -j$(nproc) O=out CC=clang CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-

      - name: Upload Kernel Image
        uses: actions/upload-artifact@v4
        with:
          name: Whyred-KernelSU-Next-Image
          path: kernel/out/arch/arm64/boot/Image.gz-dtb
